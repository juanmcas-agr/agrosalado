[functions]
  directory = "netlify/functions"

# 23:30 hora Argentina (UTC-3) = 02:30 UTC del día siguiente.
[functions."resumen-diario-hacienda"]
  schedule = "30 2 * * *"

# 22:00 hora Argentina (UTC-3) = 01:00 UTC del día siguiente.
[functions."cierre-diario-precios-relativos"]
  schedule = "0 1 * * *"
