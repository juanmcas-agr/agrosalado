[functions]
  directory = "netlify/functions"

# 23:30 hora Argentina (UTC-3) = 02:30 UTC del día siguiente.
[functions."resumen-diario-hacienda"]
  schedule = "30 2 * * *"

# 22:00 hora Argentina (UTC-3) = 01:00 UTC del día siguiente.
[functions."cierre-diario-precios-relativos"]
  schedule = "0 1 * * *"

# 21:00 hora Argentina = 00:00 UTC del día siguiente.
[functions."scraper-novillo"]
  schedule = "0 0 * * *"

# 21:15 hora Argentina = 00:15 UTC del día siguiente.
[functions."scraper-invernada"]
  schedule = "15 0 * * *"

# 21:30 hora Argentina = 00:30 UTC del día siguiente.
[functions."scraper-gasoil"]
  schedule = "30 0 * * *"

# El IPC/CPI son mensuales, no hace falta correr esto seguido. Día 15 de
# cada mes, 09:00 hora Argentina = 12:00 UTC (INDEC suele publicar el IPC
# del mes anterior entre el día 12 y el 15).
[functions."indices-inflacion"]
  schedule = "0 12 15 * *"
