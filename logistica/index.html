<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGROSALADO Logística</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AGROSALADO Logística">
  <link rel="apple-touch-icon" href="/assets/icon-512.png">
  <link rel="icon" href="/assets/icon-64.png">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <div class="fondo-fijo"></div>

  <div id="version-footer" class="version-footer"></div>

  <div class="app-layout">
  <div class="app-scroll">

  <!-- ─── LOGIN ─── (mismo mecanismo que las otras 3 apps: Supabase Auth,
       email + contraseña — acá el login es compartido por personal interno
       y transportistas, auth.js decide el modo según dónde encuentre el
       user_id) -->
  <section id="pantalla-login" class="pantalla-login">
    <img src="/assets/logo-full.png" alt="AGROSALADO" class="login-logo">
    <form id="login-form" class="formulario">
      <input id="login-email" type="email" placeholder="Email" required autocomplete="username">
      <div class="campo-password">
        <input id="login-password" type="password" placeholder="Contraseña" required autocomplete="current-password">
        <button type="button" id="login-mostrar-clave" class="boton-mostrar-clave" aria-label="Mostrar contraseña"></button>
      </div>
      <button type="submit">Ingresar</button>
      <div id="login-mensaje" class="mensaje"></div>
    </form>
  </section>

  <!-- ─── APP ─── -->
  <div id="app-shell" class="oculto">
    <header class="encabezado">
      <h1 class="titulo-app">LOGÍSTICA</h1>
      <div class="encabezado-rincon">
        <button id="logout-boton" class="boton-secundario">Salir</button>
        <span id="usuario-nombre"></span>
      </div>
    </header>

    <!-- Vista de personal interno (owner/administrativo/encargado con
         acceso_logistica) — se completa en los próximos milestones. -->
    <div id="modo-staff" class="oculto">
      <section id="pantalla-catalogo" data-screen="catalogo" class="oculto">
        <h2>Transportistas</h2>
        <div id="cat-transportistas-mensaje" class="mensaje"></div>
        <div class="tabla-scroll">
          <table id="cat-transportistas-tabla" class="tabla">
            <thead>
              <tr><th>Nombre</th><th>Email</th><th>Categoría</th><th>Empresa</th><th>CUIT</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <button type="button" id="cat-transportista-nuevo" class="boton-secundario">+ Nuevo transportista</button>

        <div id="cat-transportista-form-bloque" class="oculto">
          <h3 id="cat-transportista-form-titulo">Nuevo transportista</h3>
          <form id="cat-transportista-form" class="formulario">
            <input type="hidden" id="cat-transportista-user-id">
            <label>Nombre completo <input id="cat-transportista-nombre" type="text" required></label>
            <label>Email <input id="cat-transportista-email" type="email" required></label>
            <label>Teléfono <input id="cat-transportista-telefono" type="tel"></label>
            <div class="full radio-grupo">
              <label class="check-inline"><input type="radio" name="cat-transportista-categoria" value="propio"> Propio</label>
              <label class="check-inline"><input type="radio" name="cat-transportista-categoria" value="externo"> Externo</label>
            </div>
            <label class="full">Empresa (razón social, solo externos) <input id="cat-transportista-empresa" type="text"></label>
            <label class="full">CUIT (solo externos) <input id="cat-transportista-cuit" type="text"></label>
            <label class="full" id="cat-transportista-password-wrap">Contraseña <input id="cat-transportista-password" type="password" autocomplete="new-password"></label>
            <label class="check-inline full"><input type="checkbox" id="cat-transportista-activo" checked> Activo</label>
            <button type="submit" class="full">Guardar</button>
            <button type="button" id="cat-transportista-cancelar" class="boton-secundario full">Cancelar</button>
          </form>
        </div>

        <h2>Camiones</h2>
        <div id="cat-camiones-mensaje" class="mensaje"></div>
        <div class="tabla-scroll">
          <table id="cat-camiones-tabla" class="tabla">
            <thead><tr><th>Patente</th><th>Descripción</th><th>Estado</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <form id="cat-camion-form" class="formulario">
          <label>Patente <input id="cat-camion-patente" type="text" required style="text-transform:uppercase;"></label>
          <label>Descripción <input id="cat-camion-descripcion" type="text"></label>
          <button type="submit" class="full">Agregar camión</button>
        </form>
      </section>
    </div>

    <!-- Vista de transportista (propio o externo). Adjuntos (carta de
         porte / ticket de pesada) se agregan en el próximo milestone —
         acá todavía no hay forma de subirlos. -->
    <div id="modo-transportista" class="oculto">
      <section id="pantalla-mis-viajes" data-screen="mis-viajes" class="oculto">
        <h2 id="viaje-form-titulo">Cargar viaje</h2>
        <form id="viaje-form" class="formulario">
          <input type="hidden" id="viaje-id">
          <label>Fecha de carga <input id="viaje-fecha" type="date" required></label>
          <label>Camión
            <select id="viaje-camion" required></select>
          </label>
          <label>Origen <input id="viaje-origen" type="text" required></label>
          <label>Destino <input id="viaje-destino" type="text" required></label>
          <label>Mercadería <input id="viaje-mercaderia" type="text" required></label>
          <label>Km <input id="viaje-km" type="number" min="0" step="1"></label>
          <label>Tn <input id="viaje-tn" type="number" min="0" step="0.01"></label>
          <label class="full">Observaciones <textarea id="viaje-observaciones" rows="2"></textarea></label>
          <button type="submit" class="full" id="viaje-guardar-btn">Guardar viaje</button>
          <button type="button" id="viaje-cancelar-edicion" class="boton-secundario full oculto">Cancelar edición</button>
          <div id="viaje-form-mensaje" class="mensaje full"></div>
        </form>

        <h2>Mis viajes</h2>
        <div class="filtros">
          <label>Camión <select id="mv-filtro-camion"><option value="">Todos</option></select></label>
          <label>Mes <input type="month" id="mv-filtro-mes"></label>
          <button type="button" id="mv-filtrar" class="boton-secundario">Filtrar</button>
        </div>
        <div id="mv-mensaje" class="mensaje"></div>
        <div class="tabla-scroll">
          <table id="mv-tabla" class="tabla">
            <thead>
              <tr><th>Código</th><th>Fecha</th><th>Camión</th><th>Origen → Destino</th><th>Mercadería</th><th>Km</th><th>Tn</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  </div>

  <nav id="tab-bar-logistica" class="tab-bar-inferior oculto">
    <button type="button" id="tabbar-granos"><span class="tab-icono">🌾</span> Granos</button>
    <button type="button" id="tabbar-hacienda"><span class="tab-icono">🐄</span> Hacienda</button>
    <button type="button" id="tabbar-posgranaria"><span class="tab-icono">📈</span> Pos. Granaria</button>
    <button type="button" id="tabbar-rel"><span class="tab-icono">💹</span> $Rel</button>
    <button type="button" class="activo" disabled><span class="tab-icono">🚚</span> Logística</button>
  </nav>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
